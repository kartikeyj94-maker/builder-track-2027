
name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run ICP scoring tests
        working-directory: quivly-onboarding-engine
        run: python -m pytest test_icp_scorer.py -v
